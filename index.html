<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kharcha — Daily Expense Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe4;
  --paper-2:#ece4d3;
  --ink:#20241f;
  --ink-soft:#57584f;
  --line:#c9bfa6;
  --debit:#8a2e21;
  --debit-soft:#f2ded7;
  --credit:#1f5c4a;
  --gold:#a9812f;
  --cat-food:#b1592b;
  --cat-transport:#2c5f8a;
  --cat-bills:#5b4b8a;
  --cat-shopping:#a33b6a;
  --cat-entertainment:#1f7a72;
  --cat-health:#3f7d3a;
  --cat-business:#a9812f;
  --cat-other:#5c5c56;
  --radius:2px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1c1b17;
    --paper-2:#242320;
    --ink:#eae4d4;
    --ink-soft:#a9a291;
    --line:#43413a;
    --debit:#e08a76;
    --debit-soft:#3a2621;
    --credit:#7ec9a8;
    --gold:#d8b25f;
  }
}
:root[data-theme="dark"]{
  --paper:#1c1b17;
  --paper-2:#242320;
  --ink:#eae4d4;
  --ink-soft:#a9a291;
  --line:#43413a;
  --debit:#e08a76;
  --debit-soft:#3a2621;
  --credit:#7ec9a8;
  --gold:#d8b25f;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:920px;
  margin:0 auto;
  padding:36px 20px 80px;
}
header.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;
  margin-bottom:28px;
  flex-wrap:wrap;
  gap:10px;
}
header.top h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:clamp(28px,5vw,40px);
  margin:0;
  letter-spacing:-0.01em;
}
header.top .sub{
  font-size:13px;
  color:var(--ink-soft);
  margin-top:4px;
}
header.top .date-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  color:var(--ink-soft);
  text-align:right;
}
.theme-toggle{
  background:none;
  border:1px solid var(--line);
  color:var(--ink-soft);
  border-radius:100px;
  padding:5px 12px;
  font-size:12px;
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
}

/* summary strip */
.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin-bottom:32px;
}
.summary .cell{
  background:var(--paper-2);
  padding:18px 20px;
}
.summary .cell .label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--ink-soft);
  margin-bottom:8px;
}
.summary .cell .value{
  font-family:'IBM Plex Mono',monospace;
  font-size:26px;
  font-weight:600;
}
.summary .cell.debit .value{color:var(--debit);}
.summary .cell.credit .value{color:var(--credit);}
@media (max-width:600px){
  .summary{grid-template-columns:1fr;}
}

/* layout: form + breakdown */
.grid{
  display:grid;
  grid-template-columns:1.1fr 1fr;
  gap:28px;
  margin-bottom:34px;
}
@media (max-width:760px){
  .grid{grid-template-columns:1fr;}
}

.panel-title{
  font-family:'Fraunces',serif;
  font-size:18px;
  font-weight:600;
  margin:0 0 14px;
}

form.entry{
  background:var(--paper-2);
  border:1px solid var(--line);
  padding:20px;
}
form.entry .row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}
form.entry label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--ink-soft);
  margin-bottom:5px;
}
form.entry input, form.entry select{
  width:100%;
  padding:9px 10px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:14px;
  border-radius:var(--radius);
}
form.entry input:focus, form.entry select:focus{
  outline:2px solid var(--gold);
  outline-offset:1px;
}
form.entry .full{grid-column:1/-1;}
.type-toggle{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}
.type-toggle button{
  flex:1;
  padding:9px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink-soft);
  font-size:13px;
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  border-radius:var(--radius);
}
.type-toggle button.active[data-type="debit"]{
  background:var(--debit-soft);
  color:var(--debit);
  border-color:var(--debit);
}
.type-toggle button.active[data-type="credit"]{
  background:var(--paper-2);
  color:var(--credit);
  border-color:var(--credit);
}
form.entry button.submit{
  width:100%;
  padding:11px;
  background:var(--ink);
  color:var(--paper);
  border:none;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  border-radius:var(--radius);
  margin-top:4px;
}
form.entry button.submit:hover{opacity:.88;}

/* breakdown bars */
.breakdown{
  border:1px solid var(--line);
  padding:20px;
  background:var(--paper-2);
}
.bar-row{
  margin-bottom:13px;
}
.bar-row .meta{
  display:flex;
  justify-content:space-between;
  font-size:12.5px;
  margin-bottom:5px;
}
.bar-row .meta .cat{display:flex;align-items:center;gap:7px;}
.bar-row .swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.bar-row .amt{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);}
.bar-track{
  height:6px;
  background:var(--paper);
  border:1px solid var(--line);
  overflow:hidden;
}
.bar-fill{height:100%;}
.breakdown .empty{color:var(--ink-soft);font-size:13px;}

/* filters */
.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
  align-items:center;
}
.filters select, .filters input[type="search"]{
  padding:8px 10px;
  border:1px solid var(--line);
  background:var(--paper-2);
  color:var(--ink);
  font-size:13px;
  border-radius:var(--radius);
  font-family:'Inter',sans-serif;
}
.filters input[type="search"]{flex:1;min-width:140px;}

/* ledger table */
.ledger-wrap{
  border:1px solid var(--line);
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:560px;
}
thead th{
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--ink-soft);
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  background:var(--paper-2);
  position:sticky;
  top:0;
}
tbody td{
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  font-size:13.5px;
  vertical-align:middle;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--paper-2);}
td.amt{
  font-family:'IBM Plex Mono',monospace;
  text-align:right;
  font-weight:600;
  white-space:nowrap;
}
td.amt.debit{color:var(--debit);}
td.amt.credit{color:var(--credit);}
td.cat-tag{white-space:nowrap;}
.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--ink-soft);
}
.tag .swatch{width:8px;height:8px;border-radius:2px;}
.del-btn{
  border:none;
  background:none;
  color:var(--ink-soft);
  cursor:pointer;
  font-size:16px;
  line-height:1;
  padding:2px 6px;
}
.del-btn:hover{color:var(--debit);}
.empty-state{
  text-align:center;
  padding:40px 20px;
  color:var(--ink-soft);
  font-size:13.5px;
}
footer.note{
  margin-top:28px;
  font-size:12px;
  color:var(--ink-soft);
  text-align:center;
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Kharcha</h1>
      <div class="sub">Daily expense ledger</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="date-badge" id="todayDate"></div>
      <button class="theme-toggle" id="themeToggle" type="button">Dark</button>
    </div>
  </header>

  <section class="summary">
    <div class="cell">
      <div class="label">This month</div>
      <div class="value" id="monthTotal">₹0</div>
    </div>
    <div class="cell debit">
      <div class="label">Spent today</div>
      <div class="value" id="todayTotal">₹0</div>
    </div>
    <div class="cell credit">
      <div class="label">Income this month</div>
      <div class="value" id="monthIncome">₹0</div>
    </div>
  </section>

  <section class="grid">
    <div>
      <h2 class="panel-title">Add entry</h2>
      <form class="entry" id="entryForm">
        <div class="type-toggle">
          <button type="button" class="active" data-type="debit">Expense</button>
          <button type="button" data-type="credit">Income</button>
        </div>
        <div class="row">
          <div>
            <label for="f-amount">Amount (₹)</label>
            <input type="number" id="f-amount" min="0" step="0.01" placeholder="0.00" required>
          </div>
          <div>
            <label for="f-date">Date</label>
            <input type="date" id="f-date" required>
          </div>
        </div>
        <div class="row">
          <div class="full" id="categoryField">
            <label for="f-category">Category</label>
            <select id="f-category"></select>
          </div>
        </div>
        <div class="row">
          <div class="full">
            <label for="f-desc">Note</label>
            <input type="text" id="f-desc" placeholder="e.g. chai + samosa, client payment...">
          </div>
        </div>
        <button type="submit" class="submit">Add to ledger</button>
      </form>
    </div>

    <div>
      <h2 class="panel-title">This month, by category</h2>
      <div class="breakdown" id="breakdown"></div>
    </div>
  </section>

  <section>
    <div class="filters">
      <select id="filterCategory"></select>
      <select id="filterType">
        <option value="all">All entries</option>
        <option value="debit">Expenses only</option>
        <option value="credit">Income only</option>
      </select>
      <input type="search" id="filterSearch" placeholder="Search notes...">
    </div>
    <div class="ledger-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Note</th>
            <th style="text-align:right;">Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="ledgerBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">No entries yet. Add your first one above.</div>
    </div>
  </section>

  <footer class="note">Saved locally in this browser. Nothing leaves your device.</footer>
</div>

<script>
(function(){
  "use strict";

  var CATEGORIES = [
    { id:"food",        label:"Food & Drinks",     color:"var(--cat-food)" },
    { id:"transport",   label:"Transport",         color:"var(--cat-transport)" },
    { id:"bills",       label:"Bills & Utilities", color:"var(--cat-bills)" },
    { id:"shopping",    label:"Shopping",          color:"var(--cat-shopping)" },
    { id:"entertainment", label:"Entertainment",   color:"var(--cat-entertainment)" },
    { id:"health",      label:"Health",            color:"var(--cat-health)" },
    { id:"business",    label:"Business / Freelance", color:"var(--cat-business)" },
    { id:"other",       label:"Other",             color:"var(--cat-other)" }
  ];
  var CAT_MAP = {};
  CATEGORIES.forEach(function(c){ CAT_MAP[c.id] = c; });

  var STORAGE_KEY = "kharcha_entries_v1";
  var THEME_KEY = "kharcha_theme_v1";

  var entries = [];
  var currentType = "debit";

  function loadEntries(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      entries = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(entries)) entries = [];
    }catch(e){
      entries = [];
    }
  }

  function saveEntries(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }catch(e){
      console.error("Could not save entries", e);
    }
  }

  function loadTheme(){
    try{
      var t = localStorage.getItem(THEME_KEY);
      if(t === "light" || t === "dark"){
        document.documentElement.setAttribute("data-theme", t);
        document.getElementById("themeToggle").textContent = t === "dark" ? "Light" : "Dark";
      }
    }catch(e){}
  }

  function toggleTheme(){
    var current = document.documentElement.getAttribute("data-theme");
    var next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeToggle").textContent = next === "dark" ? "Light" : "Dark";
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  }

  function fmt(n){
    var neg = n < 0;
    n = Math.abs(n);
    var s = n.toLocaleString("en-IN", { maximumFractionDigits: 2, minimumFractionDigits: n % 1 === 0 ? 0 : 2 });
    return (neg ? "-₹" : "₹") + s;
  }

  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function isSameMonth(dateStr){
    var d = new Date(dateStr + "T00:00:00");
    var now = new Date();
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }

  function populateCategorySelects(){
    var fCat = document.getElementById("f-category");
    var filterCat = document.getElementById("filterCategory");
    fCat.innerHTML = "";
    filterCat.innerHTML = '<option value="all">All categories</option>';
    CATEGORIES.forEach(function(c){
      var o1 = document.createElement("option");
      o1.value = c.id; o1.textContent = c.label;
      fCat.appendChild(o1);
      var o2 = document.createElement("option");
      o2.value = c.id; o2.textContent = c.label;
      filterCat.appendChild(o2);
    });
  }

  function setCategoryFieldVisible(visible){
    document.getElementById("categoryField").style.display = visible ? "block" : "none";
  }

  function render(){
    renderSummary();
    renderBreakdown();
    renderLedger();
  }

  function renderSummary(){
    var monthDebit = 0, monthCredit = 0, todayDebit = 0;
    var today = todayISO();
    entries.forEach(function(e){
      if(isSameMonth(e.date)){
        if(e.type === "debit") monthDebit += e.amount;
        else monthCredit += e.amount;
      }
      if(e.date === today && e.type === "debit") todayDebit += e.amount;
    });
    document.getElementById("monthTotal").textContent = fmt(monthDebit);
    document.getElementById("todayTotal").textContent = fmt(todayDebit);
    document.getElementById("monthIncome").textContent = fmt(monthCredit);
  }

  function renderBreakdown(){
    var el = document.getElementById("breakdown");
    var totals = {};
    var grand = 0;
    entries.forEach(function(e){
      if(e.type === "debit" && isSameMonth(e.date)){
        totals[e.category] = (totals[e.category] || 0) + e.amount;
        grand += e.amount;
      }
    });
    var cats = Object.keys(totals).sort(function(a,b){ return totals[b] - totals[a]; });
    if(cats.length === 0){
      el.innerHTML = '<div class="empty">No expenses logged this month yet.</div>';
      return;
    }
    var html = "";
    cats.forEach(function(catId){
      var cat = CAT_MAP[catId] || CAT_MAP.other;
      var amt = totals[catId];
      var pct = grand > 0 ? Math.round((amt / grand) * 100) : 0;
      html += '<div class="bar-row">' +
        '<div class="meta"><span class="cat"><span class="swatch" style="background:' + cat.color + '"></span>' + cat.label + '</span>' +
        '<span class="amt">' + fmt(amt) + ' · ' + pct + '%</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + cat.color + '"></div></div>' +
        '</div>';
    });
    el.innerHTML = html;
  }

  function renderLedger(){
    var body = document.getElementById("ledgerBody");
    var empty = document.getElementById("emptyState");
    var catFilter = document.getElementById("filterCategory").value;
    var typeFilter = document.getElementById("filterType").value;
    var search = document.getElementById("filterSearch").value.trim().toLowerCase();

    var filtered = entries.filter(function(e){
      if(catFilter !== "all" && e.category !== catFilter) return false;
      if(typeFilter !== "all" && e.type !== typeFilter) return false;
      if(search && (e.note || "").toLowerCase().indexOf(search) === -1) return false;
      return true;
    });

    filtered.sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.createdAt - a.createdAt;
    });

    if(filtered.length === 0){
      body.innerHTML = "";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    var html = "";
    filtered.forEach(function(e){
      var cat = e.type === "credit" ? { label:"Income", color:"var(--credit)" } : (CAT_MAP[e.category] || CAT_MAP.other);
      var dateDisp = new Date(e.date + "T00:00:00").toLocaleDateString("en-IN", { day:"2-digit", month:"short" });
      html += "<tr>" +
        "<td>" + dateDisp + "</td>" +
        '<td class="cat-tag"><span class="tag"><span class="swatch" style="background:' + cat.color + '"></span>' + cat.label + "</span></td>" +
        "<td>" + (escapeHtml(e.note) || '<span style="color:var(--ink-soft)">—</span>') + "</td>" +
        '<td class="amt ' + e.type + '">' + (e.type === "debit" ? "-" : "+") + fmt(e.amount) + "</td>" +
        '<td><button class="del-btn" data-id="' + e.id + '" title="Delete">✕</button></td>' +
        "</tr>";
    });
    body.innerHTML = html;

    Array.prototype.forEach.call(body.querySelectorAll(".del-btn"), function(btn){
      btn.addEventListener("click", function(){
        deleteEntry(btn.getAttribute("data-id"));
      });
    });
  }

  function escapeHtml(str){
    if(!str) return "";
    return str.replace(/[&<>"']/g, function(m){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m];
    });
  }

  function deleteEntry(id){
    entries = entries.filter(function(e){ return e.id !== id; });
    saveEntries();
    render();
  }

  function addEntry(evt){
    evt.preventDefault();
    var amount = parseFloat(document.getElementById("f-amount").value);
    var date = document.getElementById("f-date").value;
    var category = document.getElementById("f-category").value;
    var note = document.getElementById("f-desc").value.trim();

    if(!amount || amount <= 0 || !date){
      return;
    }

    entries.push({
      id: "e" + Date.now() + Math.random().toString(36).slice(2,7),
      type: currentType,
      amount: amount,
      date: date,
      category: currentType === "debit" ? category : null,
      note: note,
      createdAt: Date.now()
    });
    saveEntries();

    document.getElementById("f-amount").value = "";
    document.getElementById("f-desc").value = "";
    document.getElementById("f-amount").focus();

    render();
  }

  function initTypeToggle(){
    var buttons = document.querySelectorAll(".type-toggle button");
    Array.prototype.forEach.call(buttons, function(btn){
      btn.addEventListener("click", function(){
        Array.prototype.forEach.call(buttons, function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        currentType = btn.getAttribute("data-type");
        setCategoryFieldVisible(currentType === "debit");
      });
    });
  }

  function init(){
    document.getElementById("todayDate").textContent = new Date().toLocaleDateString("en-IN", { weekday:"long", day:"2-digit", month:"long", year:"numeric" });
    document.getElementById("f-date").value = todayISO();

    loadTheme();
    document.getElementById("themeToggle").addEventListener("click", toggleTheme);

    populateCategorySelects();
    setCategoryFieldVisible(true);
    initTypeToggle();
    loadEntries();
    render();

    document.getElementById("entryForm").addEventListener("submit", addEntry);
    document.getElementById("filterCategory").addEventListener("change", renderLedger);
    document.getElementById("filterType").addEventListener("change", renderLedger);
    document.getElementById("filterSearch").addEventListener("input", renderLedger);
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
